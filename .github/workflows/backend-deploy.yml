name: Backend deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch: {}

env:
  AZURE_RESOURCE_GROUP: hiring-rg
  ACR_NAME: hiringcapstone29986
  CONTAINER_APP: hiring-backend
  IMAGE_NAME: hiring-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run Alembic migrations against Neon (fail-fast on bad migrations)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # config.py requires JWT_SECRET_KEY at import time; alembic doesn't
          # actually use it, but env.py imports config to get DATABASE_URL.
          JWT_SECRET_KEY: ci-migration-dummy-not-used-at-runtime
        run: |
          cd backend
          pip install -r requirements.txt
          alembic current
          alembic upgrade head

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login -n $ACR_NAME

      - name: Build and push image
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          docker buildx build \
            --platform linux/amd64 \
            -f backend/Dockerfile \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:latest \
            --push \
            backend
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update Container App
        run: |
          az containerapp update \
            -n $CONTAINER_APP \
            -g $AZURE_RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show -n $CONTAINER_APP -g $AZURE_RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://$FQDN/health; then
              echo " — backend healthy"
              exit 0
            fi
            echo "waiting for new revision... ($i/6)"
            sleep 10
          done
          echo "backend never returned 200" >&2
          exit 1
